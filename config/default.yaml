run:
  name: perturbseq_run
  outdir: results
  seed: 0
input:
  mode: auto
  mtx_dirs: null
  guide_mtx_dirs: null
  h5ad: null
  guide_h5ad: null
  guide_obs_column: null
  feature_type_column: feature_types
  gex_feature_type: Gene Expression
  guide_feature_types:
  - Custom
  - CRISPR Guide Capture
  var_names: gene_symbols
  cache_mtx: true
  counts_layer: null
  normalized_layer: null
  guide_table: null
  guide_table_cell_column: cell
  guide_table_gene_column: gene
  guide_table_guide_column: sgrna
  guide_table_count_column: umi_count
  guide_table_strip_prefix: true
metadata:
  file: null
  key_column: lane_id
  require_for_multilane: true
qc:
  min_genes_per_cell: 200
  min_cells_per_gene: 3
  min_genes_final: 1000
  max_pct_mt: 20.0
  max_pct_hb: null
  min_counts_per_cell: null
  mito_prefix: MT-
  ribo_prefix:
  - RPS
  - RPL
  hb_pattern: ^HB[^(P)]
guides:
  min_umi: 3
  dominance_ratio: 2.0
  max_second_umi: -1
  detection_threshold: 3
  target_regex: null
  target_split_delims:
  - _
  - '-'
  - .
  ntc_patterns:
  - ^non[-_.]?targeting
  - ^non$
  - ^ntc
  - scramble
  - ^safe[-_.]?harbor
  unassigned_label: unassigned
  ambiguous_label: ambiguous
  ntc_label: non-targeting
cluster:
  target_sum: null
  n_top_genes: 3000
  n_pcs: 50
  n_neighbors: 15
  leiden_resolution: 1.0
  umap_min_dist: 0.5
  batch_key: null
  regress_out: []
  scale_max_value: 10.0
  # Run the analysis on guide-assigned singlets only. All QC-passing cells are
  # still embedded, clustered, plotted and written first (see
  # output.write_unfiltered_h5ad); the singlets are then re-embedded on their
  # own, so multiplets shape neither the PCA space nor the clusters.
  assigned_only: false
perturbation:
  controls:
  - ntc
  - other
  primary_control: ntc
  min_cells_per_target: 10
  min_control_cells: 10
  min_pct_expressing_control: 1.0
  fdr_alpha: 0.05
  max_log2fc_for_hit: 0.0
  top_n_report: 12
  umap_background_fraction: 0.1
enrichment:
  enabled: true
  cluster_key: leiden
  controls:
  - ntc
  - other
  primary_control: other
  fdr_alpha: 0.05
  min_cells_per_target: 10
  min_cells_per_cluster: 20
  min_reference_cells: 10
  odds_pseudocount: 0.5
  stratify_by: null
  guide_concordance: true
  min_cells_per_guide: 5
  permutations: 1000
  top_n_report: 12
ps_score:
  enabled: true
  require: false
  top_n_biomarkers: 100
  scale_factor: 3.0
  ps_threshold: 0.5
  expression_cut: mean
  expression_cut_quantile: 0.75
  min_cells_per_target: 10
  min_control_cells: 10
  top_n_report: 12
  compute_lda_umap: true
  lda_n_pcs: 40
  lda_max_genes: 5000
  lda_highlight_threshold: 0.8
lochness:
  enabled: true
  genotype_key: target_gene
  n_neighbors: 300
  n_pcs: 20
  use_rep: null
  recompute_neighbors: true
  min_cells_per_target: 10
  enrichment_cut: 0.5
  noise_delta: 0.0
  top_n_report: 12
report:
  title: Perturb-seq analysis report
  embed_figures: true
  figure_format: png
  figure_dpi: 150
  max_table_rows: 100
output:
  h5ad_name: processed.h5ad
  report_name: report.html
  # Only used with cluster.assigned_only: also write the pre-filter object (all
  # QC-passing cells, own embedding) beside the analysed one. Doubles matrices.
  write_unfiltered_h5ad: true
  unfiltered_h5ad_name: null
  large_file_dir: null
  large_file_threshold_mb: 50.0
  merge_guides_into_h5ad: true
  guide_obsm_key: guide_counts
  write_guide_h5ad: false
  save_figures_pdf: false
  archive: true
  archive_name: null
  archive_exclude:
  - '*.h5ad'
  - '*.h5'
  - '*.loom'
  - '*.tar.gz'
  write_guide_table: true
  guide_table_name: null
  guide_table_min_umi: 3
