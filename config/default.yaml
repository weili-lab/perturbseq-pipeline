run:
  name: perturbseq_run
  outdir: results
  seed: 0
  stop_after: null
input:
  mode: auto
  species: human
  mtx_dirs: null
  guide_mtx_dirs: null
  h5ad: null
  guide_h5ad: null
  guide_obs_column: null
  feature_type_column: feature_types
  gex_feature_type: Gene Expression
  guide_feature_types:
  - Custom
  - CRISPR Guide Capture
  var_names: gene_symbols
  cache_mtx: false
  cell_id_format: suffix
  counts_layer: null
  normalized_layer: null
  guide_table: null
  guide_table_cell_column: cell
  guide_table_gene_column: gene
  guide_table_guide_column: sgrna
  guide_table_count_column: umi_count
  guide_table_strip_prefix: true
metadata:
  file: null
  key_column: lane_id
  require_for_multilane: true
qc:
  min_genes_per_cell: 200
  min_cells_per_gene: 3
  min_genes_final: 1000
  max_pct_mt: 20.0
  max_pct_hb: null
  min_counts_per_cell: null
  mito_prefix: MT-
  ribo_prefix:
  - RPS
  - RPL
  hb_pattern: ^HB[^(P)]
  thresholds:
    method: mad
    n_mads: 3.0
    log_transform: true
    mad_metrics:
    - total_counts
    - n_genes_by_counts
    flag_low: true
    flag_high: true
    min_genes_floor: 200
    min_counts_floor: 500
    max_genes_ceiling: null
    max_counts_ceiling: null
    max_pct_mt: 20.0
    max_pct_mt_mad: false
    max_pct_mt_by_condition: {}
    condition_key: condition_code
    max_pct_hb: null
    per_sample: {}
  doublets:
    enabled: true
    method: scrublet
    expected_doublet_rate: null
    threshold: null
    sim_doublet_ratio: 2.0
    n_prin_comps: 30
    stdev_doublet_rate: 0.02
    min_gene_counts: 3
guides:
  min_umi: 3
  dominance_ratio: 2.0
  dominance_pseudocount: 1.0
  max_second_umi: -1
  detection_threshold: 3
  target_feature_column: null
  ignored_target_values:
  - Ignore
  target_regex: null
  target_split_delims:
  - _
  - '-'
  - .
  ntc_patterns:
  - ^non[-_. ]?targeting
  - ^non$
  - ^ntc
  - scramble
  - ^safe[-_. ]?harbor
  - ^no[-_. ]?target
  unassigned_label: unassigned
  ambiguous_label: ambiguous
  ntc_label: non-targeting
  assignment_mode: single_guide
  pair_reference: null
  pair_assignment_primary: true
  require_complete_pair: true
  unresolved_pair_policy: exclude
  single_guide_diagnostic: false
  sequence_column: auto
  pair_map_file: null
  scaffold_column: scaffold
  pair_id_column: pair_id
  scaffold_classes:
  - A
  - C
  ntc_partner_policy: ambiguous
  pair_id_delimiter: ;
  designed_targeting_plus_ntc_primary: true
  source: auto
  design:
    path: null
    sheet: null
    protospacer_column: null
    target_column: null
    guide_id_column: null
    scaffold_column: null
    scaffold_table: null
    control_patterns: null
    id_format: '{target}_{n}'
    uppercase: true
  fastq:
    read_pattern: '*_R1_*.fastq.gz'
    barcode_length: 16
    umi_length: 12
    protospacer_length: 20
    scaffolds:
      A: GTTTAAGAGCTA
      C: GTTTCAGAGCTA
    anchor_search_start: 40
    position_shift: 1
    max_mismatches: 0
    tso: TTTCTTATATGGG
    restrict_to_gex_barcodes: true
    barcode_suffix_regex: -\d+$
    max_reads: null
    n_workers: null
    chunk_size: 2000000
    unmatched_sample_rate: 50
    unmatched_top_n: 50
    scaffold_specific_features: false
  multiplet:
    detection_threshold: null
    detection_min_fraction_of_top: null
    sensitivity_thresholds:
    - 3
    - 5
    - 10
    - 20
    - 50
    sensitivity_fractions:
    - 0.0
    - 0.02
    - 0.05
    - 0.1
    - 0.2
    max_guides_per_scaffold: 1
    expected_guides_per_scaffold: 1
    expected_guides_per_cell: 1
    scaffold_purity_min: 0.9
    scaffold_min_reads: 20
  high_moi:
    method: threshold
    min_umi: 10
    min_frac_of_top: 0.02
    max_guides_per_cell: 30
    min_guides_per_cell: 1
    membership_obsm_key: perturbation_membership
    guide_membership_obsm_key: guide_membership
    rank_profile_max_rank: 20
    ntc_pseudo_targets: true
cluster:
  target_sum: null
  n_top_genes: 3000
  n_pcs: 50
  n_neighbors: 15
  leiden_resolution: 1.0
  umap_min_dist: 0.5
  batch_key: null
  regress_out: []
  scale_max_value: 10.0
  assigned_only: false
perturbation:
  controls:
  - ntc
  - other
  primary_control: ntc
  min_cells_per_target: 10
  min_control_cells: 10
  min_pct_expressing_control: 1.0
  fdr_alpha: 0.05
  max_log2fc_for_hit: 0.0
  top_n_report: 12
  umap_background_fraction: 0.1
knockdown_filter:
  enabled: false
  mode: pooled
  context_key: null
  max_mean_ratio: 0.3
  max_mean_ratio_any: null
