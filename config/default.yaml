  min_cells: 30
  min_control_cells: 10
  min_pct_expressing_control: 10.0
  method: mean_ratio
  max_rho: 0.3
  max_escaper_fraction: 0.5
  min_escaper_prob: 0.9
regression:
  enabled: false
  genes: modules
  min_cells: 10
  ridge_alpha: 1.0
  n_permutations: 10
  batch_key: lane_id
  n_guides_covariate: true
  depth_covariate: true
  fdr_alpha: 0.05
  min_abs_log2fc: 0.0
enrichment:
  enabled: true
  cluster_key: leiden
  controls:
  - ntc
  - other
  primary_control: other
  fdr_alpha: 0.05
  min_cells_per_target: 10
  min_cells_per_cluster: 20
  min_reference_cells: 10
  odds_pseudocount: 0.5
  stratify_by: null
  guide_concordance: true
  min_cells_per_guide: 5
  permutations: 1000
  top_n_report: 12
modules:
