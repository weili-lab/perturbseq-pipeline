  n_programs: 4
  n_modules: 9
  cluster_distance_threshold: 0.7
  score_programs: true
  hub_lfc_threshold: 0.5
  de_fdr_alpha: 0.05
  draw_networks: true
  min_perturbations: 5
  min_genes: 10
  top_n_report: 12
  program_enrichment:
    enabled: true
    method: ora
    msigdb_version: '2026.1'
    sources:
    - hallmark
    - reactome
    - go_bp
    custom_gmt_files: {}
    fdr_alpha: 0.05
    min_overlap: 2
    min_genes: 5
    max_genes: 1500
    top_terms_per_program: 5
    require: false
  effect_source: pseudobulk
ps_score:
  enabled: false
  require: false
  top_n_biomarkers: 100
  scale_factor: 3.0
  ps_threshold: 0.5
  expression_cut: mean
  expression_cut_quantile: 0.75
  min_cells_per_target: 10
  min_control_cells: 10
  top_n_report: 12
  compute_lda_umap: true
